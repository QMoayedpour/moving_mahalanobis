globals:
  output_folder: "./results"
  dataset: "NAB"


models:
  TS2Vec:
    eval: False
    model_name: "TS2Vec"
    seq_len: 32
    stride: 32
    windows: True
    verbose: True
    device: "cpu"
    save_score: False
    model_path: "./model/ts2vec/model_weights.pth"
    print_results: False
    thresh: 12
    mode_auto: True
    n_channels : 12
    modif_score: False

  lagllama_mahala:
    eval: False
    model_name: "lagllama_mahala"
    seq_len: 32
    stride: 32
    windows: True
    verbose: True
    device: "cuda"
    save_score: False
    print_results: False
    model_path: "./model/lagllama/lag-llama.ckpt"
    thresh: 12
    mode_auto: True
    n_channels : 16
    modif_score: False
    selection: "coreset"
  
  lagllama_forecast:
    eval: True
    model_name : "lagllama_forecast"
    seq_len: 32
    device: "cuda"
    windows: True
    verbose: True
    save_score: False
    model_path: "./model/lagllama/lag-llama.ckpt"

  Donut:
    eval: False
    model_name: "Donut"
    seq_len: 120
    windows: False
    verbose: True
    test_size: 0.8
    device: "cuda"
    save_score: False
    n_epoch: 100

  Arma:
    eval: False
    model_name: "Arma"
    max_p: 5
    max_q: 5
    windows: True
    verbose: True
    save_score: False
    seq_len: 32
    device: None

  DeepAnt:
    eval: False
    model_name: "DeepAnt"
    n_epochs: 150
    device: "cuda"
    save_score: False
    seq_len: 32
    verbose: True
    batch_size: 128
    windows: False